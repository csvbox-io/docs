<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">CSVbox data flow with Europe selected as the data location</title>
  <desc id="desc">Users upload CSV or Excel files to the CSVbox server in Europe (Germany). The server pushes validated data to your systems and can optionally store the file in a file datastore in Europe, from which your systems can read it. Only import metadata and logs, without file contents, go to the metadata datastore in the United States.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#007BFF"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <rect width="960" height="640" rx="16" fill="#FFFFFF"/>

  <!-- United States region: metadata only -->
  <rect x="320" y="24" width="320" height="156" rx="14" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="340" y="52" font-size="15" font-weight="600" fill="#374151">United States</text>
  <text x="340" y="71" font-size="12.5" fill="#6B7280">Metadata only</text>
  <g>
    <path d="M410 98 v52 a70 14 0 0 0 140 0 v-52" fill="#F3F4F6" stroke="#6B7280" stroke-width="2"/>
    <ellipse cx="480" cy="98" rx="70" ry="14" fill="#FFFFFF" stroke="#6B7280" stroke-width="2"/>
    <text x="480" y="134" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">Metadata</text>
    <text x="480" y="152" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">datastore</text>
  </g>

  <!-- Europe region: selected data location -->
  <rect x="320" y="236" width="320" height="330" rx="14" fill="#EFF6FF" stroke="#007BFF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="340" y="264" font-size="15" font-weight="600" fill="#0B4FA8">Europe (Germany)</text>
  <text x="340" y="283" font-size="12.5" fill="#3B6FB6">Selected data location</text>

  <!-- CSVbox server -->
  <rect x="400" y="300" width="160" height="72" rx="12" fill="#007BFF"/>
  <text x="480" y="331" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">CSVbox</text>
  <text x="480" y="352" font-size="14" fill="#FFFFFF" text-anchor="middle">server</text>

  <!-- File datastore (optional) -->
  <g>
    <path d="M410 456 v52 a70 14 0 0 0 140 0 v-52" fill="#E8F2FF" stroke="#007BFF" stroke-width="2"/>
    <ellipse cx="480" cy="456" rx="70" ry="14" fill="#FFFFFF" stroke="#007BFF" stroke-width="2"/>
    <text x="480" y="492" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">File</text>
    <text x="480" y="510" font-size="14" font-weight="600" fill="#1F2937" text-anchor="middle">datastore</text>
  </g>

  <!-- Users' files -->
  <g>
    <rect x="52" y="292" width="176" height="80" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
    <rect x="46" y="298" width="176" height="80" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
    <rect x="40" y="304" width="176" height="80" rx="10" fill="#FFFFFF" stroke="#007BFF" stroke-width="2"/>
    <text x="128" y="338" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">Users upload files</text>
    <text x="128" y="360" font-size="12.5" fill="#6B7280" text-anchor="middle">CSV, Excel</text>
  </g>

  <!-- Your systems -->
  <g>
    <rect x="744" y="296" width="196" height="80" rx="40" fill="#FFFFFF" stroke="#007BFF" stroke-width="2"/>
    <text x="842" y="330" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">Your systems</text>
    <text x="842" y="352" font-size="12.5" fill="#6B7280" text-anchor="middle">API, database, apps</text>
  </g>

  <!-- Upload -->
  <line x1="216" y1="336" x2="396" y2="336" stroke="#007BFF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="270" y="326" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Upload</text>

  <!-- Push validated data -->
  <line x1="560" y1="336" x2="740" y2="336" stroke="#007BFF" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="692" y="326" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Validated data</text>

  <!-- Metadata to US -->
  <line x1="480" y1="300" x2="480" y2="170" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
  <text x="492" y="206" font-size="12.5" font-weight="600" fill="#374151">Import metadata and logs</text>
  <text x="492" y="223" font-size="12" fill="#6B7280">No file contents</text>

  <!-- Store file (optional) -->
  <line x1="480" y1="372" x2="480" y2="438" stroke="#007BFF" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="492" y="410" font-size="12.5" font-weight="600" fill="#1F2937">Store file</text>
  <text x="492" y="426" font-size="12" fill="#3B6FB6">Optional</text>

  <!-- Read from CSVbox (optional) -->
  <path d="M552 482 H842 V380" fill="none" stroke="#007BFF" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  <text x="712" y="472" font-size="12.5" font-weight="600" fill="#1F2937" text-anchor="middle">Read from CSVbox</text>
  <text x="712" y="503" font-size="12" fill="#3B6FB6" text-anchor="middle">Optional</text>

  <!-- Legend -->
  <g font-size="12.5" fill="#374151">
    <line x1="320" y1="602" x2="356" y2="602" stroke="#007BFF" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="366" y="606">Always</text>
    <line x1="440" y1="602" x2="476" y2="602" stroke="#007BFF" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
    <text x="486" y="606">Optional</text>
    <line x1="566" y1="602" x2="602" y2="602" stroke="#6B7280" stroke-width="2.5" marker-end="url(#arrow-muted)"/>
    <text x="612" y="606">Metadata</text>
  </g>
</svg>
