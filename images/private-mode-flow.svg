<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-labelledby="title desc" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">CSVbox Private Mode data flow</title>
  <desc id="desc">User files are processed in the client browser. Your custom code sends the data from the browser directly to your system, so the data never transits CSVbox servers and is not stored in the CSVbox datastore. Only metadata that describes the import is sent to CSVbox.</desc>

  <defs>
    <marker id="pm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#007BFF"/>
    </marker>
    <marker id="pm-arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>

  <rect width="900" height="540" rx="16" fill="#FFFFFF"/>

  <!-- Columns -->
  <rect x="16" y="20" width="220" height="400" rx="14" fill="#EFF6FF" stroke="#007BFF" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="126" y="52" font-size="17" font-weight="700" fill="#0B4FA8" text-anchor="middle">Client browser</text>

  <rect x="340" y="20" width="220" height="400" rx="14" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="450" y="52" font-size="17" font-weight="700" fill="#6B7280" text-anchor="middle">CSVbox</text>

  <rect x="664" y="20" width="220" height="400" rx="14" fill="#F0FDF4" stroke="#16A34A" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="774" y="52" font-size="17" font-weight="700" fill="#166534" text-anchor="middle">Your system</text>

  <!-- User files, processed in the browser -->
  <rect x="53" y="118" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <rect x="47" y="124" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#60A5FA" stroke-width="2"/>
  <rect x="41" y="130" width="170" height="84" rx="10" fill="#FFFFFF" stroke="#007BFF" stroke-width="2"/>
  <text x="126" y="167" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle">User files</text>
  <text x="126" y="189" font-size="13.5" fill="#6B7280" text-anchor="middle">CSV, Excel</text>
  <text x="126" y="252" font-size="14" font-weight="600" fill="#0B4FA8" text-anchor="middle">Processed and</text>
  <text x="126" y="271" font-size="14" font-weight="600" fill="#0B4FA8" text-anchor="middle">validated here</text>

  <!-- CSVbox servers (not used for file data) -->
  <rect x="365" y="134" width="170" height="76" rx="12" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2"/>
  <text x="450" y="167" font-size="19" font-weight="700" fill="#9CA3AF" text-anchor="middle">CSVbox</text>
  <text x="450" y="190" font-size="16" fill="#9CA3AF" text-anchor="middle">servers</text>

  <!-- Datastore (not used for file data) -->
  <path d="M380 296 v58 a70 14 0 0 0 140 0 v-58" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="6 4"/>
  <ellipse cx="450" cy="296" rx="70" ry="14" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="335" font-size="16" font-weight="600" fill="#9CA3AF" text-anchor="middle">Datastore</text>
  <text x="450" y="355" font-size="13.5" fill="#9CA3AF" text-anchor="middle">AWS S3</text>
  <text x="450" y="398" font-size="13.5" font-weight="600" fill="#374151" text-anchor="middle">Only import metadata is kept</text>

  <!-- Your system -->
  <rect x="685" y="130" width="178" height="84" rx="42" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="774" y="167" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle">API, app,</text>
  <text x="774" y="188" font-size="16" font-weight="600" fill="#1F2937" text-anchor="middle">database</text>

  <!-- Metadata only -->
  <line x1="217" y1="172" x2="361" y2="172" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#pm-arrow-muted)"/>
  <text x="288" y="160" font-size="13.5" font-weight="600" fill="#6B7280" text-anchor="middle">Metadata only</text>

  <!-- Data path via your custom code -->
  <path d="M126 284 V452 H774 V218" fill="none" stroke="#007BFF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#pm-arrow)"/>
  <rect x="352" y="438" width="196" height="28" rx="14" fill="#FFFFFF"/>
  <text x="450" y="457" font-size="15" font-weight="600" fill="#1F2937" text-anchor="middle">Your custom code</text>

  <!-- Legend -->
  <g font-size="14.5" fill="#374151">
    <line x1="170" y1="510" x2="214" y2="510" stroke="#007BFF" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#pm-arrow)"/>
    <text x="224" y="515">User data, sent by your code</text>
    <line x1="470" y1="510" x2="514" y2="510" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#pm-arrow-muted)"/>
    <text x="524" y="515">Import metadata only</text>
  </g>
</svg>
